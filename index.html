<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD-33 · Manifestación Digital</title>
    <!-- Enlazamos el CSS externo -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Fondo espacial (está en CSS) -->

    <!-- Barra de navegación estilo cyberpunk -->

        <a href="#">🌌 Inicio</a>
        <a href="#">📜 Decretos</a>
        <a href="#">⚡ GitHub</a>

    <!-- Contenido principal -->
    <div class="contenedor">
        <h1>⚡ MD-33 ⚡</h1>
        <p class="subtitulo">El espejo refleja tu código</p>

        <!-- Tarjeta O_o -->
        <div class="card" id="estadoOjo">
            <h2>O_o</h2>
            <p>Ojo Macro (Arriba) <span id="macro">🌌</span></p>

        <!-- Tarjeta del Decreto -->
        <div class="card" id="consolaViva">
            <h2>📜 Decreto Actual</h2>
            <p id="mensajeDinamico">"Separa la tierra del fuego, lo sutil de lo grosero."</p>
            <button onclick="cambiarDecreto()">Ejecutar Nuevo Decreto</button>
        </div>

        <footer>
            <p>Subido a la nube sin tocar la terminal 🚀</p>
        </footer>
    </div>

    <!-- Enlazamos el JavaScript al final -->
    <script src="script.js"></script>
